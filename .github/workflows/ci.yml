name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26
        run: ./script/select-xcode-26.sh

      - name: SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null; then
            brew install swiftlint
          fi
          swiftlint --strict

      - name: Test release planning
        run: |
          ./script/test-plan-release.sh
          ./script/test-update-cask.sh

      - name: Build with strict concurrency checks
        run: >-
          swift build
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warn-concurrency
          -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test

      - name: Build and verify universal app bundle
        run: ./build-app.sh

  pull-request-standard:
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened", "synchronize", "edited"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test pull request checker
        run: ./script/test-check-pull-request.sh

      - name: Verify pull request format
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./script/check-pull-request.sh