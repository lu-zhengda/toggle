name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release planning
        run: |
          ./script/test-plan-release.sh
          ./script/test-update-cask.sh

      - name: Build with strict concurrency checks
        run: >-
          swift build
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warn-concurrency
          -Xswiftc -warnings-as-errors

      - name: Run tests
        run: swift test

      - name: Build and verify universal app bundle
        run: ./build-app.sh